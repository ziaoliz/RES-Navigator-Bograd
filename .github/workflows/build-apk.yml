name: Build RES Navigator APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: |
          chmod +x ./gradlew
          sed -i 's/\r$//' ./gradlew  # <--- Исправляет проблему с Windows-переносами строк

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug --stacktrace # <--- Выведет подробную ошибку, если что-то не так

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RES-Navigator-Bograd-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
